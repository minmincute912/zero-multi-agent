# Hermes Agent core config. deploy/update-vps.sh copies this file to ~/.hermes/config.yaml (backup kept), so the repo
# is the source of truth: edit here, not on the VPS.
# Secrets: ~/.hermes/.env, referenced as ${VAR}. Never inline them.
#   needs: LITELLM_MASTER_KEY, HERMES_CORE_DIR (+ messaging tokens). deploy/setup-vps.sh sets the first two.
# Schemas: https://hermes-agent.nousresearch.com/docs/user-guide/configuring-models
#          https://hermes-agent.nousresearch.com/docs/reference/mcp-config-reference
# After a change: `hermes config check`, then `hermes gateway restart` (drains in-flight turns first).
# UNVERIFIED on a live Hermes: the model/provider block below follows the docs' examples; confirm with `hermes doctor`.

# --- Inference: everything goes through the local LiteLLM router (groups: light | heavy | coder) ---
providers:
  inference-router:
    api: http://127.0.0.1:4000/v1
    api_key: ${LITELLM_MASTER_KEY}
    discover_models: false
    models: [light, heavy, coder]

model:
  provider: inference-router
  default: heavy
  api_mode: chat_completions

# Cheap side-tasks use the light group so they do not burn the heavy pool.
auxiliary:
  compression:
    provider: custom
    model: light
    base_url: http://127.0.0.1:4000/v1
    api_key: ${LITELLM_MASTER_KEY}
  title_generation:
    provider: custom
    model: light
    base_url: http://127.0.0.1:4000/v1
    api_key: ${LITELLM_MASTER_KEY}

# --- MCP ---
mcp_servers:
  # stdio: spawned by Hermes natively (lightweight, no Docker hop)
  filesystem:
    command: "npx"
    # Scoped to ONE directory on purpose. Never widen to $HOME or /.
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/srv/hermes/workspace"]
    timeout: 120
    enabled: true

  fetch:
    command: "uvx"
    args: ["mcp-server-fetch"]
    timeout: 120
    enabled: true

  # Add Streamable HTTP MCP servers here (no `transport: sse`: SSE is legacy).

# --- Skills: Git-tracked, loaded from this repo and used as the write target for agent-created skills ---
skills:
  create_dir: ${HERMES_CORE_DIR}/skills
