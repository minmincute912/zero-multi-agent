# Run from the repo root so secrets come from ./.env:
#   docker compose --env-file .env -f docker-services/docker-compose.yml up -d
# Every published port is bound to 127.0.0.1. Reach them remotely over Tailscale or an SSH tunnel, never the public NIC.
# Resource caps are hard limits sized for a 3 vCPU / 6 GB VPS (3.5 GB of caps leaves ~2.5 GB for the OS, swap and native Hermes).

name: hermes-platform

x-common: &common
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  networks: [agent-net]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  inference-router:
    <<: *common
    image: ghcr.io/berriai/litellm:main-stable   # floating tag; pin a digest once you have validated a version
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      NOUS_API_KEY: ${NOUS_API_KEY:-}
      COLAB_OLLAMA_BASE_URL: ${COLAB_OLLAMA_BASE_URL:-}
    volumes:
      - ./inference-router/config.yaml:/app/config.yaml:ro
    ports: ["127.0.0.1:4000:4000"]
    mem_limit: 1536m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  mcp-web-worker:
    <<: *common
    image: ghcr.io/${GHCR_OWNER:-local}/hermes-mcp-web-worker:${IMAGE_TAG:-latest}
    build: ./mcp-web-worker
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # owner of ./browser-profiles on the host
    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:?set VNC_PASSWORD in .env}
      PROFILE_DIR: /data/profile
      HOME: /tmp
    volumes:
      - ./browser-profiles:/data/profile            # cookies/sessions survive restarts; git-ignored
    ports:
      - "127.0.0.1:8001:8001"                       # MCP (Streamable HTTP, path /mcp)
      - "127.0.0.1:6080:6080"                       # noVNC: manual login for 2FA/captcha
    shm_size: 1gb                                   # Chromium crashes with the default 64 MB /dev/shm
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  agent-net:
    name: agent-net   # services reach each other by name; add future plugins here
