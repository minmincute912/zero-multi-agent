# Copy to nodes.yaml (git-ignored; it holds your private endpoints) and enable the nodes you really have.
# Each node must implement:  GET <health_path> -> 2xx   and   POST <job_path> (JSON body, X-Signature header).
# secret_env names an environment variable passed to the container (see docker-compose.yml); never put secrets here.
nodes:
  - name: cf-worker-1
    kind: cloudflare-worker
    url: https://example.workers.dev
    health_path: /health
    job_path: /jobs
    secret_env: NODE_CF_SECRET
    daily_limit: 1000          # check the provider's real free quota before relying on this number
    enabled: false

  - name: colab-t4
    kind: google-colab
    url: http://100.64.0.10:8080   # tailnet address of the tunnel/relay in front of the notebook
    secret_env: NODE_COLAB_SECRET
    daily_limit: 20
    enabled: false
